# Teste pontual (apagar depois): cifra as chaves api-tennis com uma chave pública. Só imprime texto cifrado + estado da chave.
name: Chaves api-tennis
on:
  workflow_dispatch:
permissions: {}
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      K1: ${{ secrets.API_TENNIS_KEY }}
      K2: ${{ secrets.API_TENNIS_KEY_2 }}
      K3: ${{ secrets.API_TENNIS_KEY_3 }}
    steps:
      - run: |
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkY3qd6MCtE1TlNpUSGa0
          4WOHAKI5owmakuWtCxOpZkEhZXyTH9aliJrCvG664mL0tEz8EUJ1YFLgnnf1vjdN
          OnqeDCNAWn02m/iiTYy+hI4a11YUu8eBBJEwqsly1WYkfVueF9fastz62KDfsjht
          K3Nsq+wFSCuq7YMjMQVMVRCBOljV4/1+mwI48ZdKRIKxVPStTEvnchSKd+sBjrE5
          auE7e1LoP1JO4ICeDAuUsl9QypzUvKJaR/VWt5DoviVOV9iUwunWZinsn+bgon/h
          ljFPn/YLgjFR64Cf7BGjxfIhGoRCXaIgwHJUufCVrYttdgMM/6Syuxtz2f1qt7vf
          TQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          for n in K1 K2 K3; do
            v="${!n}"
            echo "$n tamanho=${#v} virgulas=$(printf %s "$v" | tr -cd , | wc -c)"
            for k in $(echo "$v" | tr , ' '); do
              if curl -s "https://api.api-tennis.com/tennis/?method=get_livescore&APIkey=$k" | grep -q '"error":"1"'; then st=recusada; else st=valida; fi
              echo "  $n estado=$st cifrada=$(printf %s "$k" | openssl pkeyutl -encrypt -pubin -inkey pub.pem | base64 -w0)"
            done
          done
