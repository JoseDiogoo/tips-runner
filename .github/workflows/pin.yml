name: teste pinnacle ligas
# Só leitura: lista as ligas da Pinnacle (API pública de convidado) com jogos, para ver as competições de seleções e basquetebol. Sem segredos.
on: workflow_dispatch
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python - <<'PY'
          import urllib.request, json, re
          B = "https://guest.api.arcadia.pinnacle.com/0.1"
          def get(p):
              return json.load(urllib.request.urlopen(urllib.request.Request(B + p, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"}), timeout=30))
          for sid, nome in ((29, "futebol"), (4, "basquetebol")):
              try:
                  L = get(f"/sports/{sid}/leagues?all=false")
              except Exception as e:
                  print("FALHA", nome, repr(e)[:120]); continue
              print("==", nome, len(L), "ligas")
              for l in sorted(L, key=lambda l: l["name"]):
                  n = l.get("matchupCount", 0)
                  if n and (nome == "basquetebol" or re.search("nations|friendl|international|world|euro|africa|qualif|copa|cup|champions|u21|u19", l["name"], re.I)):
                      print(l["id"], l["name"], n)
          PY
