# Teste pontual (apagar depois): latência das odds de ténis ao vivo na Pinnacle (API pública). Sem segredos.
name: Teste Pinnacle ao vivo
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request
          B = "https://guest.api.arcadia.pinnacle.com/0.1"
          def get(p):
              r = urllib.request.urlopen(urllib.request.Request(B + p, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"}), timeout=30)
              return json.load(r), {k: r.headers.get(k) for k in ("Age", "cf-cache-status", "Date")}
          ms, h = get("/sports/33/matchups")
          print("matchups:", len(ms), h)
          live = [m for m in ms if m.get("isLive") and m.get("type") == "matchup" and len(m.get("participants", [])) == 2 and "doubles" not in m["league"]["name"].lower()]
          print("ao vivo (singulares):", len(live))
          for m in live[:12]:
              print("  ", m["id"], m["league"]["name"], [p["name"] for p in m["participants"]], {k: m.get(k) for k in ("liveMode", "status", "state")})
          pick = ([m for m in live if m["league"]["name"].lower().startswith(("atp", "wta"))] + live)[:3]
          if pick:
              d, _ = get(f"/matchups/{pick[0]['id']}/markets/related/straight")
              print("exemplo mercados:", json.dumps(d)[:1200])
          last, changes, ages = {}, {m["id"]: 0 for m in pick}, []
          for i in range(36):  # ~6 min, de 10 em 10 s
              for m in pick:
                  try:
                      d, h = get(f"/matchups/{m['id']}/markets/related/straight")
                  except Exception as e:
                      print("ERR", m["id"], e); continue
                  ml = [(p["designation"], p["price"]) for k in d if k.get("type") == "moneyline" and k.get("period") == 0 for p in k["prices"]]
                  ages.append(int(h["Age"] or 0))
                  mark = ""
                  if last.get(m["id"]) not in (None, ml):
                      changes[m["id"]] += 1; mark = "  <== MUDOU"
                  last[m["id"]] = ml
                  print(time.strftime("%H:%M:%S"), m["id"], [p["name"][:10] for p in m["participants"]], ml, "Age", h["Age"], h["cf-cache-status"], mark, flush=True)
              time.sleep(10)
          print("RESUMO mudanças por jogo:", changes, "| Age max:", max(ages or [0]), "| Age médio:", sum(ages) / max(len(ages), 1))
          PY
