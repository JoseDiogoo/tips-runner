# Vigia: se uma atualização fica presa (o GitHub às vezes demora 20+ min a fechar uma corrida que já acabou; limite de 22 min: a atualização normal demora 12 a 14 min), cancela-a para a fila `dados` e as decisões da IA não ficarem bloqueadas.
name: Vigia das atualizações
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          now=$(date +%s)
          # a idade conta desde que o job `update` começou a trabalhar (não desde a criação da corrida: uma atualização que espera 14 min na fila pela anterior era cancelada em saudável)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?status=in_progress&per_page=20" --jq '.workflow_runs[].id' | while read -r id; do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name=="update" and .status!="queued") | .started_at] | min // empty')
            [ -z "$started" ] && continue
            age=$(( now - $(date -d "$started" +%s) ))
            if [ "$age" -gt 1320 ]; then
              echo "corrida $id presa há $(( age / 60 )) min: a cancelar"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" > /dev/null || gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" > /dev/null || true
            fi
          done
