# Semanal: retreina o modelo de ténis. Saída para ficheiro (logs públicos).
name: Treinar modelo
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
concurrency:
  group: dados
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
    working-directory: code
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TIPS_TOKEN }}
      TIPS_REPO: JoseDiogoo/tips
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseDiogoo/tips
          token: ${{ secrets.TIPS_TOKEN }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt > /dev/null 2>&1 || { echo "pip falhou"; exit 1; }
      - run: mkdir -p data && python cloud.py pull > /tmp/run.log 2>&1 || { echo "pull falhou (sem log publico)"; exit 1; }
      - run: python -u -W ignore train.py > data/train_log.txt 2>&1 || { echo "train falhou (sem log publico)"; exit 1; }
      - run: python cloud.py push >> /tmp/run.log 2>&1 || { echo "push falhou (sem log publico)"; exit 1; }
