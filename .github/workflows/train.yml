# Diário (~7 min): retreina o modelo de ténis. Saída para ficheiro (logs públicos).
name: Treinar modelo
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: dados
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
    working-directory: code
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TIPS_TOKEN }}
      TIPS_REPO: JoseDiogoo/tips
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseDiogoo/tips
          token: ${{ secrets.TIPS_TOKEN }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt > /dev/null 2>&1 || { echo "pip falhou"; exit 1; }
      - run: mkdir -p data && python cloud.py pull > /tmp/run.log 2>&1 || { echo "pull falhou (sem log publico)"; exit 1; }
      - run: python -u -W ignore train.py > data/train_log.txt 2>&1 || { echo "train falhou (sem log publico)"; exit 1; }
      - run: python cloud.py push >> /tmp/run.log 2>&1 || { echo "push falhou - $(grep -a PUSHERR /tmp/run.log | tail -1)"; exit 1; }
      - if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: .
        run: |
          curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ Treinar modelo falhou - ver github.com/JoseDiogoo/tips-runner/actions" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
      - if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        working-directory: .
        run: |
          # voltou ao normal: a corrida anterior que chegou a executar o job `train` (ignora saltadas e canceladas) tinha falhado?
          api="https://api.github.com/repos/$REPO/actions"
          prev=""
          for id in $(curl -s "$api/workflows/train.yml/runs?status=completed&per_page=12" | jq -r --arg me "$RUN_ID" '.workflow_runs[] | select((.id | tostring) != $me) | .id'); do
            c=$(curl -s "$api/runs/$id/jobs" | jq -r '[.jobs[] | select(.name == "train") | .conclusion][0] // empty')
            if [ "$c" = "success" ] || [ "$c" = "failure" ]; then prev=$c; break; fi
          done
          if [ "$prev" = "failure" ]; then
            curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="✅ Treinar modelo voltou ao normal" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
          fi
