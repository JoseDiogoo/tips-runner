name: Teste Pinnacle
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for u in https://www.pinnacle.com/en/ https://guest.api.arcadia.pinnacle.com/0.1/sports/29/leagues; do
            echo "$u -> $(curl -s -m 20 -o /tmp/o -w '%{http_code}' -A 'Mozilla/5.0' $u) $(head -c 120 /tmp/o | tr '\n' ' ')"
          done
