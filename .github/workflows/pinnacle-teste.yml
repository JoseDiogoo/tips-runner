name: Teste Pinnacle
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          B=https://guest.api.arcadia.pinnacle.com/0.1
          g() { curl -s -m 20 -A 'Mozilla/5.0' -H 'Accept: application/json' -w '\nHTTP %{http_code}\n' "$B$1"; }
          echo "##SPORTS"; g /sports | head -c 600
          for s in 29 4 33; do
            echo "##LEAGUES $s"; curl -s -m 20 -A 'Mozilla/5.0' "$B/sports/$s/leagues" -o /tmp/l$s.json -w 'HTTP %{http_code}\n'
            python3 - <<PY
          import json
          d=json.load(open('/tmp/l$s.json'))
          d=[x for x in d if x.get('matchupCount',0)>0]
          print(len(d),'ligas com jogos'); print(json.dumps(sorted(d,key=lambda x:-x['matchupCount'])[:6],ensure_ascii=False)[:900])
          open('/tmp/top$s','w').write(str(sorted(d,key=lambda x:-x['matchupCount'])[0]['id']))
          PY
            L=$(cat /tmp/top$s)
            echo "##MATCHUPS $s league $L"; curl -s -m 20 -A 'Mozilla/5.0' "$B/leagues/$L/matchups" -o /tmp/m$s.json -w 'HTTP %{http_code}\n'; head -c 1500 /tmp/m$s.json; echo
            echo "##MARKETS $s league $L"; curl -s -m 20 -A 'Mozilla/5.0' "$B/leagues/$L/markets/straight" -o /tmp/k$s.json -w 'HTTP %{http_code}\n'; head -c 1200 /tmp/k$s.json; echo
          done
