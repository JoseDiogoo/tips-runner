# Repositório público só para ter minutos de Actions grátis: o código e os dados ficam no repositório privado.
# Toda a saída vai para um ficheiro (os logs deste repositório são públicos).
name: Atualizar dados
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_odds:
        description: "Ignorar os intervalos e pedir já as odds de futebol/NBA (gasta créditos)"
        type: boolean
        default: false
concurrency:
  group: dados
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
    working-directory: code
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TIPS_TOKEN }}
      TIPS_REPO: JoseDiogoo/tips
      FORCE_ODDS: ${{ inputs.force_odds }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }},${{ secrets.ODDS_API_KEY_2 }},${{ secrets.ODDS_API_KEY_3 }},${{ secrets.ODDS_API_KEY_4 }},${{ secrets.ODDS_API_KEY_5 }}
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }},${{ secrets.API_TENNIS_KEY_2 }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY_1 }},${{ secrets.API_FOOTBALL_KEY_2 }},${{ secrets.API_FOOTBALL_KEY_3 }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_2 }},${{ secrets.ODDSPAPI_KEY_3 }},${{ secrets.ODDSPAPI_KEY_4 }},${{ secrets.ODDSPAPI_KEY }}
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY_1 }},${{ secrets.HIGHLIGHTLY_KEY_2 }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseDiogoo/tips
          token: ${{ secrets.TIPS_TOKEN }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt > /dev/null 2>&1 || { echo "pip falhou"; exit 1; }
      - run: mkdir -p data && python cloud.py pull > /tmp/run.log 2>&1 || { echo "pull falhou (sem log publico)"; exit 1; }
      - run: python -W ignore update.py >> /tmp/run.log 2>&1 || { echo "update falhou (sem log publico)"; exit 1; }
      - run: python cloud.py push >> /tmp/run.log 2>&1 || { echo "push falhou (sem log publico)"; exit 1; }
      - if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: .
        run: |
          curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ Atualizar dados falhou - ver github.com/JoseDiogoo/tips-runner/actions" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
