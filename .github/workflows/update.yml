# Repositório público só para ter minutos de Actions grátis: o código e os dados ficam no repositório privado.
# Toda a saída vai para um ficheiro (os logs deste repositório são públicos).
name: Atualizar dados
# Dois modos no mesmo workflow (o grupo `dados` só guarda 1 execução pendente: dois workflows cancelavam-se uns aos outros):
# atualização completa (:08 :23 :38 :53) e decisão IA leve (de 10 em 10 min, ~3 min), que não espera pelos ~10 min do update.
run-name: ${{ (github.event.schedule == '5,15,25,35,45,55 * * * *' || inputs.only_decide) && 'decisão IA' || 'atualização' }}
on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
    - cron: "8,23,38,53 * * * *"  # de 15 em 15 min; o cron do GitHub falha/atrasa, por isso o job check salta os que chegam com uma atualização recente
  workflow_dispatch:
    inputs:
      only_if_stale:
        description: "Só atualizar se a última atualização tiver mais de 12 min (usado pelo agendador externo)"
        type: boolean
        default: false
      only_decide:
        description: "Só a decisão final da banca IA (rápida)"
        type: boolean
        default: false
      redo_ia:
        description: "Refazer a triagem do comité IA dos jogos das próximas 3 h (depois de mudar prompts)"
        type: boolean
        default: false
      force_odds:
        description: "Ignorar os intervalos e pedir já as odds de futebol/NBA (gasta créditos)"
        type: boolean
        default: false
permissions: {}
defaults:
  run:
    shell: bash
    working-directory: code
jobs:
  check:  # agendado: só corre a atualização se a última com sucesso tiver mais de 12 min (dois crons por hora sem duplicar pedidos às APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      skip: ${{ steps.age.outputs.skip }}
      decide: ${{ steps.age.outputs.decide }}
    steps:
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ONLY_DECIDE: ${{ inputs.only_decide }}
          STALE_ONLY: ${{ inputs.only_if_stale }}
          URL: https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=success&per_page=30
          ALL_URL: https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=30
          RUN_ID: ${{ github.run_id }}
        run: |
          skip=false
          decide=false
          if [ "$SCHEDULE" = "5,15,25,35,45,55 * * * *" ] || [ "$ONLY_DECIDE" = "true" ]; then
            decide=true
            # a atualização completa também decide (execute): se há uma à espera ou a correr, esta decisão não vale a pena e, sobretudo, não a pode substituir na fila
            busy=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$ALL_URL" | jq -r --arg me "$RUN_ID" '[.workflow_runs[] | select(.display_title == "atualização" and .status != "completed" and (.id | tostring) != $me)] | length' || echo 0)
            if [ "${busy:-0}" -gt 0 ]; then skip=true; fi
          elif [ "$EVENT" = "schedule" ] || [ "$STALE_ONLY" = "true" ]; then
            last=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$URL" | jq -r '[.workflow_runs[] | select(.display_title != "decisão IA")][0].created_at // empty' || true)
            if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 720 ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "decide=$decide" >> "$GITHUB_OUTPUT"
  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:  # só este job escreve na release: o grupo `dados` está aqui (e não no workflow) para o job `check` correr sempre e uma decisão IA nunca substituir na fila uma atualização à espera
      group: dados
      cancel-in-progress: false
    timeout-minutes: 25  # a atualização leva 12 a 15 min (cresce com o número de jogos); o vigia cancela aos 22 min desde o início do job; mais do que isto é uma corrida presa e tem de libertar a fila (grupo dados)
    env:
      GH_TOKEN: ${{ secrets.TIPS_TOKEN }}
      TIPS_REPO: JoseDiogoo/tips
      FORCE_ODDS: ${{ inputs.force_odds }}
      IA_REDO: ${{ inputs.redo_ia }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }},${{ secrets.ODDS_API_KEY_2 }},${{ secrets.ODDS_API_KEY_3 }},${{ secrets.ODDS_API_KEY_4 }},${{ secrets.ODDS_API_KEY_5 }}
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }},${{ secrets.API_TENNIS_KEY_2 }},${{ secrets.API_TENNIS_KEY_3 }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY_1 }},${{ secrets.API_FOOTBALL_KEY_2 }},${{ secrets.API_FOOTBALL_KEY_3 }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_2 }},${{ secrets.ODDSPAPI_KEY_3 }},${{ secrets.ODDSPAPI_KEY_4 }},${{ secrets.ODDSPAPI_KEY }}
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY_1 }},${{ secrets.HIGHLIGHTLY_KEY_2 }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_4 }},${{ secrets.GEMINI_API_KEY_5 }},${{ secrets.GEMINI_API_KEY_6 }},${{ secrets.GEMINI_API_KEY_7 }},${{ secrets.GEMINI_API_KEY_8 }},${{ secrets.GEMINI_API_KEY_9 }},${{ secrets.GEMINI_API_KEY_10 }}
      GROQ_API_KEY: ${{ secrets.GROQ_1 }},${{ secrets.GROQ_2 }},${{ secrets.GROQ_3 }},${{ secrets.GROQ_4 }},${{ secrets.GROQ_5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseDiogoo/tips
          token: ${{ secrets.TIPS_TOKEN }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt > /dev/null 2>&1 || { echo "pip falhou"; exit 1; }
      - run: mkdir -p data && python cloud.py pull > /tmp/run.log 2>&1 || { echo "pull falhou (sem log publico)"; exit 1; }
      - if: needs.check.outputs.decide != 'true'
        run: python -W ignore update.py >> /tmp/run.log 2>&1 || { echo "update falhou (sem log publico)"; exit 1; }
      - if: needs.check.outputs.decide == 'true'
        run: python -W ignore decide.py >> /tmp/run.log 2>&1 || { echo "decide falhou (sem log publico)"; exit 1; }
      - run: python cloud.py ${{ needs.check.outputs.decide == 'true' && 'push-ia' || 'push' }} >> /tmp/run.log 2>&1 || { echo "push falhou - $(grep -a PUSHERR /tmp/run.log | tail -1)"; exit 1; }
      - if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: .
        run: |
          curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ Atualizar dados falhou - ver github.com/JoseDiogoo/tips-runner/actions" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
      - if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        working-directory: .
        run: |
          # voltou ao normal: a corrida anterior que chegou a executar o job `update` (ignora saltadas e canceladas) tinha falhado?
          api="https://api.github.com/repos/$REPO/actions"
          prev=""
          for id in $(curl -s "$api/workflows/update.yml/runs?status=completed&per_page=12" | jq -r --arg me "$RUN_ID" '.workflow_runs[] | select((.id | tostring) != $me) | .id'); do
            c=$(curl -s "$api/runs/$id/jobs" | jq -r '[.jobs[] | select(.name == "update") | .conclusion][0] // empty')
            if [ "$c" = "success" ] || [ "$c" = "failure" ]; then prev=$c; break; fi
          done
          if [ "$prev" = "failure" ]; then
            curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="✅ Atualizar dados voltou ao normal" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
          fi
