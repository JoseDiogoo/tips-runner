# Repositório público só para ter minutos de Actions grátis: o código e os dados ficam no repositório privado.
# Toda a saída vai para um ficheiro (os logs deste repositório são públicos).
name: Atualizar dados
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"  # reserva: o cron do GitHub falha/atrasa; se o das :23 correu, este salta (ver o job check)
  workflow_dispatch:
    inputs:
      only_if_stale:
        description: "Só atualizar se a última atualização tiver mais de 40 min (usado pelo agendador externo)"
        type: boolean
        default: false
      force_odds:
        description: "Ignorar os intervalos e pedir já as odds de futebol/NBA (gasta créditos)"
        type: boolean
        default: false
concurrency:
  group: dados
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
    working-directory: code
jobs:
  check:  # agendado: só corre a atualização se a última com sucesso tiver mais de 40 min (dois crons por hora sem duplicar pedidos às APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      skip: ${{ steps.age.outputs.skip }}
    steps:
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          STALE_ONLY: ${{ inputs.only_if_stale }}
          URL: https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=success&per_page=1
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ] || [ "$STALE_ONLY" = "true" ]; then
            last=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$URL" | jq -r '.workflow_runs[0].created_at // empty' || true)
            if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 2400 ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TIPS_TOKEN }}
      TIPS_REPO: JoseDiogoo/tips
      FORCE_ODDS: ${{ inputs.force_odds }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }},${{ secrets.ODDS_API_KEY_2 }},${{ secrets.ODDS_API_KEY_3 }},${{ secrets.ODDS_API_KEY_4 }},${{ secrets.ODDS_API_KEY_5 }}
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }},${{ secrets.API_TENNIS_KEY_2 }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY_1 }},${{ secrets.API_FOOTBALL_KEY_2 }},${{ secrets.API_FOOTBALL_KEY_3 }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_2 }},${{ secrets.ODDSPAPI_KEY_3 }},${{ secrets.ODDSPAPI_KEY_4 }},${{ secrets.ODDSPAPI_KEY }}
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY_1 }},${{ secrets.HIGHLIGHTLY_KEY_2 }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }},${{ secrets.GROQ_1 }},${{ secrets.GROQ_2 }},${{ secrets.GROQ_3 }},${{ secrets.GROQ_4 }},${{ secrets.GROQ_5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseDiogoo/tips
          token: ${{ secrets.TIPS_TOKEN }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt > /dev/null 2>&1 || { echo "pip falhou"; exit 1; }
      - run: mkdir -p data && python cloud.py pull > /tmp/run.log 2>&1 || { echo "pull falhou (sem log publico)"; exit 1; }
      - run: python -W ignore update.py >> /tmp/run.log 2>&1 || { echo "update falhou (sem log publico)"; exit 1; }
      - run: python cloud.py push >> /tmp/run.log 2>&1 || { echo "push falhou (sem log publico)"; exit 1; }
      - if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: .
        run: |
          curl -s -o /dev/null -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ Atualizar dados falhou - ver github.com/JoseDiogoo/tips-runner/actions" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
